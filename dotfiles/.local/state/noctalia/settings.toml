[plugin_settings."0rgl/ask-claude"]
model = "default"
open_target = "tmux"

[plugins]
enabled = [
    "damian-ds7/battery-threshold",
    "rylos/syncthing",
    "davemhammer/tailscale",
    "carlocamacho/taildrop",
    "nightwatch75/file-search",
    "noctalia/bitwarden",
    "8bury/mini-docker",
    "rylos/usb-manager",
    "notfinaldev/web-search",
    "alexander/screen-toolkit",
    "noctalia/screen_recorder",
    "yuuto/calculator",
    "kenn/keybind-cheatsheet",
    "riversyx/noctaproton-vpn",
    "rylos/remmina",
    "weinguyen/shell-command",
    "3dprogramin/ufw",
    "0rgl/ask-claude",
    "cleboost/ssh-launcher"
]

[shell]
font_family = "Arabic Newspaper"
time_format = "{:%-I:%M %p}"

    [shell.launcher]
    default_view = "all"
    pinned = [ "brave-origin-nightly", "spotify" ]
    sort_by_usage = false

    [shell.screenshot]
    directory = "/home/zeno/Pictures/Screenshots"

[theme]
builtin = "Eldritch"
shell_mode = "dark"

[wallpaper]
fill_mode = "center"

    [wallpaper.default]
    path = "/home/zeno/Pictures/Wallpapers/rivendell.jpg"

    [wallpaper.last]
    path = "/home/zeno/Pictures/Wallpapers/rivendell.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/zeno/Pictures/Wallpapers/rivendell.jpg"

    [wallpaper.monitors.HDMI-A-3]
    path = "/home/zeno/Pictures/Wallpapers/rivendell.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/zeno/Pictures/Wallpapers/rivendell.jpg"

    [wallpaper.monitors.eDP-2]
    path = "/home/zeno/Pictures/Wallpapers/rivendell.jpg"

[widget.audio_visualizer]
anchor = true
bands = 90
centered = false
width = 600

[widget.bar]
type = "rylos/remmina:bar"

[widget.bar_2]
type = "rylos/syncthing:bar"

[widget.bar_3]
hide_when_empty = false
type = "rylos/usb-manager:bar"

[widget.bar_4]
type = "riversyx/noctaproton-vpn:bar"

[widget.bar_5]
type = "yuuto/calculator:bar"

[widget.bar_6]
enabled = false
type = "riversyx/noctaproton-vpn:bar"

[widget.battery]
display_mode = "graphic"

[widget.brightness]
enabled = false

[widget.clock]
format = "{:%-I:%M %p}"

[widget.control-center]
enabled = false

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.launcher]
enabled = false

[widget.media]
artist_first = true
max_length = 399
min_length = 272
show_progress = true

[widget.mini-docker]
type = "8bury/mini-docker:mini-docker"

[widget.network]
enabled = false

[widget.notifications]
enabled = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.status]
type = "davemhammer/tailscale:status"

[widget.status_2]
type = "3dprogramin/ufw:status"

[widget.tray]
drawer = true
hide_passive = false

[widget.widget]
type = "alexander/screen-toolkit:widget"