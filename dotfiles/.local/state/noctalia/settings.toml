config_version = 16

[backdrop]
enabled = true

[bar]
order = [ "Primary" ]

    [bar.Primary]
    capsule_radius = 5
    center = [ "group:g4" ]
    end = [
        "group:g2",
        "notifications",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "group:g1",
        "control-center",
        "group:g3",
        "session"
    ]
    start = [ "media", "audio_visualizer", "bar_6" ]
    thickness = 35

        [[bar.Primary.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "tray", "status", "mini-docker", "bar", "bar_2", "status_2", "bar_3", "bar_4" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Primary.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "battery", "sysmon" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

        [[bar.Primary.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g4"
        members = [ "workspaces", "screenshot", "widget", "recorder", "wallpaper", "keybinds" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

        [[bar.Primary.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g3"
        members = [ "clock", "bar_5" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

[bluetooth]
connect_when_enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 1800.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 4500.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 3600.0

